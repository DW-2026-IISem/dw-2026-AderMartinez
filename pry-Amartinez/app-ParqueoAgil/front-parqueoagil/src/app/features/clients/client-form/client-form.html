<<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    
    <!-- Nombre -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
      <input type="text" formControlName="name"
        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500">
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <p class="text-red-500 text-xs mt-1">El nombre es obligatorio.</p>
      }
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" formControlName="email"
        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500">
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <p class="text-red-500 text-xs mt-1">Debe ser un email válido.</p>
      }
    </div>

    <!-- Teléfono -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
      <input type="text" formControlName="phone"
        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Dirección -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
      <input type="text" formControlName="address"
        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500">
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-200">
    <button type="button" (click)="cancelled.emit()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
      Cancelar
    </button>
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">
      {{ isEditing ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</form>
