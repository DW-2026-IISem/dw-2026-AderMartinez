<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg mb-4">
        <i class="pi pi-car text-white text-3xl"></i>
      </div>
      <h2 class="text-3xl font-bold text-gray-800">Bienvenido</h2>
      <p class="text-gray-500 mt-2">Ingresa a ParqueoÁgil</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario o Correo</label>
        <input 
          type="text" 
          [(ngModel)]="identifier" 
          name="identifier"
          required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          placeholder="admin"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          placeholder="••••••••"
        >
      </div>

      <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-lg"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
